name: CI

on:
  push:
  pull_request:

jobs:
  # Offline tests only: no Spine assets, no network.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest .
      - run: python -m pytest

  # Needs the official Spine example asset (downloaded on demand, SHA-256
  # verified). Kept separate so an external outage cannot fail the offline job.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/spine
          key: spine-goblins-pro-skel-7941a9cf
      - run: pip install pytest .
      - run: python -m pytest -m integration
        env:
          SPINE_FIXTURE_REQUIRED: "1"
