name: Publish to PyPI

# PyPI trusted publishing: the pending publisher on pypi.org names this file
# (publish.yml) and the "pypi" environment. Run it by hand for an existing
# tag, or push a py-v* tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build and publish (py-vX.Y.Z, e.g. py-v0.3.0)"
        required: true
  push:
    tags:
      - "py-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only a py-vX.Y.Z tag can be published, checked out as a tag.
      - name: Check the tag name
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^py-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref || github.ref_name }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Test
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skel-mesh-parser
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
