[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skel-mesh-parser"
version = "0.2.0"
description = "Minimal dependency-free parser for the skin/attachment section of Spine skeleton binary files (.skel, 3.8.x and 4.2.x). Python port of the js branch's spine-skeleton-binary-js."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the official Spine example asset (downloaded on
# demand, SHA-256 verified) and are excluded by default. Run them with:
#   pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs the official Spine example asset (downloaded on demand or via SPINE_GOBLINS_SKEL)",
]

[tool.hatch.build.targets.wheel]
packages = ["skel_mesh_parser"]
